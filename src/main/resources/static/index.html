<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Metadata</title>
</head>
<body>
<main>
    <h1>URL metadata</h1>
    <form id="metadata-form">
        <label for="url">URL</label>
        <input id="url" name="url" type="url" placeholder="https://example.com" required>
        <button type="submit">Fetch description</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" hidden>
        <h2 id="title"></h2>
        <p id="description"></p>
        <a id="result-url"></a>
        <img id="image" alt="" hidden>
    </section>
</main>
<script>
    const form = document.querySelector("#metadata-form");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.hidden = true;
        status.textContent = "Fetching metadata...";

        try {
            const response = await fetch("/api/metadata", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: form.elements.url.value })
            });

            if (!response.ok) {
                const message = await response.text();
                throw new Error(message || `Request failed (${response.status})`);
            }

            const metadata = await response.json();
            document.querySelector("#title").textContent = metadata.title || "";
            document.querySelector("#description").textContent = metadata.description || "";
            const resultUrl = document.querySelector("#result-url");
            resultUrl.href = metadata.url || "";
            resultUrl.textContent = metadata.url || "";

            const image = document.querySelector("#image");
            image.hidden = !metadata.image;
            image.src = metadata.image || "";
            result.hidden = false;
            status.textContent = "";
        } catch (error) {
            status.textContent = error.message;
        }
    });
</script>
</body>
</html>
